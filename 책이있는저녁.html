<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>책이있는 저녁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #4C3F91;
    --purple-light: #7469B3;
    --purple-pale: #EDEAF8;
    --teal: #1D9E75;
    --teal-pale: #E1F5EE;
    --amber: #BA7517;
    --amber-pale: #FAEEDA;
    --text: #1a1a2e;
    --text-muted: #666680;
    --text-hint: #aaaacc;
    --bg: #f8f7ff;
    --bg-card: #ffffff;
    --border: rgba(76,63,145,0.12);
    --border-med: rgba(76,63,145,0.22);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Header */
  .header {
    padding: 52px 20px 16px;
    background: var(--bg-card);
    border-bottom: 0.5px solid var(--border);
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-end; }
  .header-eyebrow { font-size: 11px; color: var(--text-hint); letter-spacing: 0.08em; margin-bottom: 2px; }
  .header-title { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 600; color: var(--text); }
  .header-add-btn {
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s;
  }
  .header-add-btn:hover { background: var(--purple-light); transform: scale(1.08); }

  /* Content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 80px;
  }

  /* Tab bar */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 100;
  }
  .tab {
    flex: 1;
    padding: 10px 0 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
    background: none; border: none;
  }
  .tab-icon { font-size: 20px; }
  .tab-label { font-size: 10px; color: var(--text-hint); font-family: 'Noto Sans KR', sans-serif; }
  .tab.active .tab-label { color: var(--purple); }

  /* Page */
  .page { display: none; }
  .page.active { display: block; }

  /* Section */
  .section { padding: 20px 20px 0; }
  .section-label {
    font-size: 11px; font-weight: 700; color: var(--text-hint);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
  }

  /* Next meeting card */
  .next-meeting {
    background: var(--purple);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 10px 28px rgba(76, 63, 145, 0.38);
  }
  .meeting-tag { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
  .meeting-book { font-family: 'Noto Serif KR', serif; font-size: 18px; color: #fff; margin-bottom: 10px; }
  .meeting-detail { font-size: 12px; color: rgba(255,255,255,0.75); margin-bottom: 3px; }
  .dday {
    display: inline-block; margin-top: 10px;
    background: rgba(255,255,255,0.18); color: #fff;
    font-size: 12px; font-weight: 700; padding: 4px 12px;
    border-radius: 20px;
  }
  .no-meeting {
    background: var(--purple-pale); border-radius: var(--radius);
    padding: 20px; text-align: center; margin-bottom: 20px;
    color: var(--purple-light); font-size: 14px;
  }

  /* Book card */
  .book-card {
    display: flex; gap: 14px; align-items: center;
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px;
    box-shadow: 0 2px 12px rgba(76, 63, 145, 0.07);
  }
  .book-cover {
    width: 44px; height: 60px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-author { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stars { display: flex; gap: 3px; align-items: center; }
  .star { width: 11px; height: 11px; border-radius: 50%; }
  .star.on { background: var(--amber); }
  .star.off { background: #e5e5f0; }
  .review-count { font-size: 11px; color: var(--text-hint); margin-left: 4px; }

  /* Review board */
  .review-card {
    background: var(--bg-card); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  }
  .review-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .review-book-title { font-size: 13px; font-weight: 700; color: var(--purple); }
  .review-stars { display: flex; gap: 2px; }
  .review-star { width: 10px; height: 10px; border-radius: 50%; }
  .review-star.on { background: var(--amber); }
  .review-star.off { background: #e5e5f0; }
  .review-author { font-size: 11px; color: var(--text-hint); margin-bottom: 6px; }
  .review-text { font-size: 13px; color: var(--text-muted); line-height: 1.65; font-family: 'Noto Serif KR', serif; }
  .review-date { font-size: 11px; color: var(--text-hint); text-align: right; }
  .review-footer-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-top: 10px; flex-wrap: wrap;
  }

  /* Schedule card */
  .schedule-card {
    border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  }
  .schedule-card.upcoming { background: var(--purple-pale); border: 0.5px solid rgba(76,63,145,0.2); }
  .schedule-card.past { background: var(--bg-card); border: 0.5px solid var(--border); }
  .schedule-tag { font-size: 11px; color: var(--purple-light); margin-bottom: 4px; }
  .schedule-tag.past { color: var(--text-hint); }
  .schedule-book { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .schedule-meta { font-size: 12px; color: var(--text-muted); }
  .schedule-card-actions {
    display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
  }

  /* Card actions */
  .card-actions {
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    flex-wrap: wrap;
  }
  .book-card { align-items: flex-start; }
  .card-action-btn {
    font-size: 12px; padding: 5px 12px;
    border: 0.5px solid var(--border-med); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--purple); cursor: pointer;
    font-family: inherit; white-space: nowrap;
    transition: background 0.12s, border-color 0.12s;
  }
  .card-action-btn:hover { background: var(--purple-pale); border-color: rgba(76,63,145,0.35); }
  .card-action-btn.danger {
    color: #b33; border-color: rgba(180,51,51,0.35);
  }
  .card-action-btn.danger:hover { background: #fff5f5; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(20,18,40,0.5);
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 420px;
    padding: 24px 20px 40px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border-med); margin: 0 auto 20px;
  }
  .modal-title { font-family: 'Noto Serif KR', serif; font-size: 18px; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--text-hint); letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
  .form-input, .form-textarea, .form-select {
    width: 100%; padding: 12px 14px;
    border: 0.5px solid var(--border-med); border-radius: var(--radius-sm);
    font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); background: var(--bg);
    outline: none; transition: border 0.15s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--purple); }
  .form-textarea { resize: none; height: 80px; }
  .star-picker { display: flex; gap: 8px; }
  .star-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 0.5px solid var(--border-med);
    background: var(--bg); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
  }
  .star-btn.selected { background: var(--amber-pale); border-color: var(--amber); }
  .form-btn {
    width: 100%; padding: 14px;
    background: var(--purple); color: white;
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
    margin-top: 8px;
  }
  .form-btn:hover { background: var(--purple-light); }

  /* Empty state */
  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--text-hint); font-size: 14px; line-height: 1.8;
  }

  /* Emoji palette */
  .emoji-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .emoji-opt {
    width: 40px; height: 40px; border-radius: 8px;
    border: 0.5px solid var(--border-med); background: var(--bg);
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
  }
  .emoji-opt.selected { border-color: var(--purple); background: var(--purple-pale); }

  /* color palette */
  .color-palette { display: flex; gap: 8px; margin-top: 8px; }
  .color-opt {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all 0.1s;
  }
  .color-opt.selected { border-color: var(--text); transform: scale(1.15); }

  /* Auth (Google) */
  .auth-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 0.5px solid var(--border);
  }
  .auth-profile {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .auth-photo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 0.5px solid var(--border-med);
  }
  .auth-display-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .auth-buttons {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .auth-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    background: var(--purple);
    color: #fff;
    transition: background 0.15s, opacity 0.15s;
  }
  .auth-btn:hover { background: var(--purple-light); }
  .auth-btn-outline {
    background: transparent;
    color: var(--purple);
    border: 0.5px solid var(--border-med);
  }
  .auth-btn-outline:hover { background: var(--purple-pale); }
  .auth-btn-small {
    font-size: 11px;
    padding: 6px 10px;
  }
  .header-add-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }
  .review-author-display {
    padding: 12px 14px;
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    min-height: 44px;
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-eyebrow">독서모임</div>
    <div class="header-top">
      <div class="header-title">책이있는 저녁</div>
      <button class="header-add-btn" id="main-add-btn" onclick="openAddModal()" disabled>＋</button>
    </div>
    <div class="auth-row" id="auth-row">
      <div class="auth-profile" id="auth-profile" hidden>
        <img id="auth-photo" class="auth-photo" alt="" width="28" height="28" decoding="async" />
        <span id="auth-display-name" class="auth-display-name"></span>
      </div>
      <div class="auth-buttons">
        <button type="button" class="auth-btn" id="btn-google-login">구글 로그인</button>
        <button type="button" class="auth-btn auth-btn-outline auth-btn-small" id="btn-edit-nickname" hidden>닉네임</button>
        <button type="button" class="auth-btn auth-btn-outline" id="btn-logout" hidden>로그아웃</button>
      </div>
    </div>
    <div id="sync-status" style="font-size:11px;color:var(--text-hint);margin-top:10px;min-height:14px;"></div>
  </div>

  <!-- Content -->
  <div class="content" id="content">

    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="section" style="padding-top:20px;">
        <div class="section-label">다음 모임</div>
        <div id="next-meeting-area"></div>

        <div class="section-label">최근 읽은 책</div>
        <div id="home-books-area"></div>
      </div>
    </div>

    <!-- BOOKS -->
    <div class="page" id="page-books">
      <div class="section" style="padding-top:20px;">
        <div class="section-label">우리가 읽은 책</div>
        <div id="books-area"></div>
      </div>
    </div>

    <!-- REVIEWS -->
    <div class="page" id="page-reviews">
      <div class="section" style="padding-top:20px;">
        <div class="section-label">한줄평 게시판</div>
        <div id="reviews-area"></div>
      </div>
    </div>

    <!-- SCHEDULE -->
    <div class="page" id="page-schedule">
      <div class="section" style="padding-top:20px;">
        <div class="section-label">모임 일정</div>
        <div id="schedule-area"></div>
      </div>
    </div>

  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab active" id="tab-home" onclick="showPage('home')">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">홈</span>
    </button>
    <button class="tab" id="tab-books" onclick="showPage('books')">
      <span class="tab-icon">📚</span>
      <span class="tab-label">책 목록</span>
    </button>
    <button class="tab" id="tab-reviews" onclick="showPage('reviews')">
      <span class="tab-icon">✍️</span>
      <span class="tab-label">한줄평</span>
    </button>
    <button class="tab" id="tab-schedule" onclick="showPage('schedule')">
      <span class="tab-icon">📅</span>
      <span class="tab-label">일정</span>
    </button>
  </div>
</div>

<!-- ===== MODALS ===== -->

<!-- Select what to add -->
<div class="modal-overlay" id="modal-select">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">무엇을 추가할까요?</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="form-btn" style="background:var(--purple);" onclick="openNewBookModal()">📚 책 추가</button>
      <button class="form-btn" style="background:var(--teal);" onclick="openNewReviewModal()">✍️ 한줄평 쓰기</button>
      <button class="form-btn" style="background:var(--purple); opacity:0.82;" onclick="openNewScheduleModal()">📅 모임 일정 추가</button>
      <button class="form-btn" style="background:var(--text-hint); margin-top:4px;" onclick="closeAllModals()">취소</button>
    </div>
  </div>
</div>

<!-- Add Book Modal -->
<div class="modal-overlay" id="modal-book">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-book-title-text">책 추가</div>
    <div class="form-group">
      <label class="form-label">책 제목 *</label>
      <input class="form-input" id="book-title" placeholder="예) 파친코">
    </div>
    <div class="form-group">
      <label class="form-label">저자 *</label>
      <input class="form-input" id="book-author" placeholder="예) 이민진">
    </div>
    <div class="form-group">
      <label class="form-label">읽은 날짜</label>
      <input class="form-input" id="book-date" type="month">
    </div>
    <div class="form-group">
      <label class="form-label">아이콘 선택</label>
      <div class="emoji-palette" id="emoji-palette">
        <div class="emoji-opt selected" data-emoji="📖" onclick="selectEmoji(this)">📖</div>
        <div class="emoji-opt" data-emoji="📚" onclick="selectEmoji(this)">📚</div>
        <div class="emoji-opt" data-emoji="📕" onclick="selectEmoji(this)">📕</div>
        <div class="emoji-opt" data-emoji="📗" onclick="selectEmoji(this)">📗</div>
        <div class="emoji-opt" data-emoji="📘" onclick="selectEmoji(this)">📘</div>
        <div class="emoji-opt" data-emoji="📙" onclick="selectEmoji(this)">📙</div>
        <div class="emoji-opt" data-emoji="🔖" onclick="selectEmoji(this)">🔖</div>
        <div class="emoji-opt" data-emoji="✨" onclick="selectEmoji(this)">✨</div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">표지 색상</label>
      <div class="color-palette" id="color-palette">
        <div class="color-opt selected" data-color="#EEEDFE" style="background:#EEEDFE;" onclick="selectColor(this)"></div>
        <div class="color-opt" data-color="#E1F5EE" style="background:#E1F5EE;" onclick="selectColor(this)"></div>
        <div class="color-opt" data-color="#FAEEDA" style="background:#FAEEDA;" onclick="selectColor(this)"></div>
        <div class="color-opt" data-color="#FAECE7" style="background:#FAECE7;" onclick="selectColor(this)"></div>
        <div class="color-opt" data-color="#EAF3DE" style="background:#EAF3DE;" onclick="selectColor(this)"></div>
        <div class="color-opt" data-color="#FBEAF0" style="background:#FBEAF0;" onclick="selectColor(this)"></div>
      </div>
    </div>
    <button class="form-btn" id="book-submit-btn" onclick="saveBook()">추가하기</button>
    <button class="form-btn" style="background:transparent; color:var(--text-hint); margin-top:4px;" onclick="closeAllModals()">취소</button>
  </div>
</div>

<!-- Add Review Modal -->
<div class="modal-overlay" id="modal-review">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-review-title-text">한줄평 쓰기</div>
    <div class="form-group">
      <label class="form-label">책 선택 *</label>
      <select class="form-select" id="review-book">
        <option value="">책을 선택하세요</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">작성자</label>
      <div class="review-author-display" id="review-author-display">로그인 후 표시됩니다</div>
    </div>
    <div class="form-group">
      <label class="form-label">별점</label>
      <div class="star-picker" id="star-picker">
        <button class="star-btn" data-val="1" onclick="selectStar(1)">★</button>
        <button class="star-btn" data-val="2" onclick="selectStar(2)">★</button>
        <button class="star-btn" data-val="3" onclick="selectStar(3)">★</button>
        <button class="star-btn" data-val="4" onclick="selectStar(4)">★</button>
        <button class="star-btn" data-val="5" onclick="selectStar(5)">★</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">한줄평 *</label>
      <textarea class="form-textarea" id="review-text" placeholder="이 책을 한 문장으로 표현해보세요"></textarea>
    </div>
    <button class="form-btn" id="review-submit-btn" onclick="saveReview()">등록하기</button>
    <button class="form-btn" style="background:transparent; color:var(--text-hint); margin-top:4px;" onclick="closeAllModals()">취소</button>
  </div>
</div>

<!-- Add Schedule Modal -->
<div class="modal-overlay" id="modal-schedule">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-schedule-title-text">모임 일정 추가</div>
    <div class="form-group">
      <label class="form-label">읽을 책 제목 *</label>
      <input class="form-input" id="sched-book" placeholder="예) 파친코">
    </div>
    <div class="form-group">
      <label class="form-label">모임 날짜 *</label>

<div class="modal-overlay" id="modal-nickname">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  where,
  getDocs,
  writeBatch,
  serverTimestamp,
  setDoc,
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHPsB-NNmTtvX86PMeCY8g09PxhXmRRbo",
  authDomain: "book-80a08.firebaseapp.com",
  projectId: "book-80a08",
  storageBucket: "book-80a08.firebasestorage.app",
  messagingSenderId: "238769215698",
  appId: "1:238769215698:web:d54e19d3cbc30b6029f50b",
  measurementId: "G-4F18RGEMN5",
};

const COL_BOOKS = "bbe_books";
const COL_REVIEWS = "bbe_reviews";
const COL_SCHEDULES = "bbe_schedules";
const COL_PROFILES = "bbe_profiles";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

/** Firestore onSnapshot 해제용 */
let firestoreUnsubs = [];

/** 로그인 사용자 프로필 — Firestore `nickname` (없으면 빈 문자열, 로드 전에는 null) */
let profileNickname = null;
let profileUnsub = null;

function unsubscribeProfile() {
  if (profileUnsub) {
    profileUnsub();
    profileUnsub = null;
  }
  profileNickname = null;
}

function subscribeProfile(uid) {
  unsubscribeProfile();
  profileUnsub = onSnapshot(
    doc(db, COL_PROFILES, uid),
    (snap) => {
      if (!snap.exists()) {
        profileNickname = "";
      } else {
        profileNickname = String(snap.data().nickname ?? "").trim();
      }
      updateAuthUI(auth.currentUser);
      refreshReviewAuthorDisplay();
    },
    (err) => {
      console.error(err);
      profileNickname = "";
      updateAuthUI(auth.currentUser);
      refreshReviewAuthorDisplay();
    }
  );
}

function getGoogleFallbackName(user = auth.currentUser) {
  if (!user) return "";
  return (
    user.displayName ||
    (user.email ? user.email.split("@")[0] : "") ||
    "사용자"
  );
}

function setSyncStatus(text, isErr) {
  const el = document.getElementById("sync-status");
  if (!el) return;
  el.textContent = text;
  el.style.color = isErr ? "#b33" : "";
}

// ===== STATE (Firestore 스냅샷으로 채움) =====
let state = {
  books: [],
  reviews: [],
  schedules: [],
  selectedEmoji: '📖',
  selectedColor: '#EEEDFE',
  selectedStar: 0,
};

let editingBookId = null;
let editingReviewId = null;
let editingScheduleId = null;

function docToBook(d) {
  const x = d.data();
  return {
    id: d.id,
    title: x.title ?? "",
    author: x.author ?? "",
    date: x.date ?? "",
    emoji: x.emoji ?? "📖",
    color: x.color ?? "#EEEDFE",
  };
}

function docToReview(d) {
  const x = d.data();
  return {
    id: d.id,
    bookId: x.bookId ?? "",
    bookTitle: x.bookTitle ?? "",
    author: x.author ?? "",
    rating: Number(x.rating) || 0,
    text: x.text ?? "",
    date: x.date ?? "",
  };
}

function docToSchedule(d) {
  const x = d.data();
  return {
    id: d.id,
    book: x.book ?? "",
    date: x.date ?? "",
    time: x.time ?? "",
    place: x.place ?? "",
  };
}

function unsubscribeFirestore() {
  firestoreUnsubs.forEach((u) => u());
  firestoreUnsubs = [];
}

function subscribeFirestore() {
  unsubscribeFirestore();

  firestoreUnsubs.push(
    onSnapshot(
      query(collection(db, COL_BOOKS), orderBy("createdAt", "desc")),
      (snap) => {
        state.books = snap.docs.map(docToBook);
        render();
      },
      (err) => {
        console.error(err);
        setSyncStatus("책 목록 동기화 오류 · 규칙/네트워크를 확인하세요", true);
      }
    )
  );

  firestoreUnsubs.push(
    onSnapshot(
      query(collection(db, COL_REVIEWS), orderBy("createdAt", "desc")),
      (snap) => {
        state.reviews = snap.docs.map(docToReview);
        render();
      },
      (err) => {
        console.error(err);
        setSyncStatus("한줄평 동기화 오류 · 규칙/네트워크를 확인하세요", true);
      }
    )
  );

  firestoreUnsubs.push(
    onSnapshot(
      query(collection(db, COL_SCHEDULES), orderBy("date", "desc")),
      (snap) => {
        state.schedules = snap.docs.map(docToSchedule);
        render();
      },
      (err) => {
        console.error(err);
        setSyncStatus("일정 동기화 오류 · 규칙/네트워크를 확인하세요", true);
      }
    )
  );

  setSyncStatus("실시간 동기화 연결됨");
}

function updateAuthUI(user) {
  const loginBtn = document.getElementById("btn-google-login");
  const logoutBtn = document.getElementById("btn-logout");
  const nickBtn = document.getElementById("btn-edit-nickname");
  const profile = document.getElementById("auth-profile");
  const nameEl = document.getElementById("auth-display-name");
  const photoEl = document.getElementById("auth-photo");
  if (!loginBtn || !logoutBtn || !profile || !nameEl || !photoEl) return;

  if (!user) {
    loginBtn.hidden = false;
    logoutBtn.hidden = true;
    if (nickBtn) nickBtn.hidden = true;
    profile.hidden = true;
    photoEl.removeAttribute("src");
    return;
  }

  loginBtn.hidden = true;
  logoutBtn.hidden = false;
  if (nickBtn) nickBtn.hidden = false;
  profile.hidden = false;

  nameEl.textContent = getWriterDisplayName();

  if (user.photoURL) {
    photoEl.src = user.photoURL;
    photoEl.hidden = false;
  } else {
    photoEl.removeAttribute("src");
    photoEl.hidden = true;
  }
}

function setMainInteractionEnabled(on) {
  const btn = document.getElementById("main-add-btn");
  if (btn) btn.disabled = !on;
}

/** 헤더·한줄평 작성자 — Firestore 닉네임 우선, 없으면 구글 표시 이름 */
function getWriterDisplayName() {
  if (!auth.currentUser) return "";
  const custom =
    profileNickname != null ? String(profileNickname).trim() : "";
  if (custom) return custom;
  return getGoogleFallbackName();
}

function refreshReviewAuthorDisplay() {
  const el = document.getElementById("review-author-display");
  if (!el) return;
  if (!auth.currentUser) {
    el.textContent = "로그인이 필요합니다";
    return;
  }
  el.textContent = getWriterDisplayName();
}

document.getElementById("btn-google-login").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (e) {
    console.error(e);
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      alert(
        "로그인에 실패했습니다. Firebase Console → Authentication에서 Google 로그인을 사용 설정했는지 확인하세요."
      );
    }
  }
});

document.getElementById("btn-logout").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (e) {
    console.error(e);
    alert("로그아웃에 실패했습니다.");
  }
});

document.getElementById("btn-edit-nickname").addEventListener("click", () => {
  openNicknameModal();
});

function openNicknameModal() {
  if (!auth.currentUser) return;
  const input = document.getElementById("nickname-input");
  if (input) {
    const cur =
      profileNickname != null && profileNickname !== ""
        ? profileNickname
        : getGoogleFallbackName();
    input.value = cur;
  }
  closeAllModals();
  document.getElementById("modal-nickname").classList.add("open");
}

async function saveNickname() {
  const u = auth.currentUser;
  if (!u) return;
  const input = document.getElementById("nickname-input");
  const nick = (input?.value ?? "").trim();
  if (!nick) {
    alert("닉네임을 입력해 주세요.");
    return;
  }
  if (nick.length > 40) {
    alert("닉네임은 40자 이내로 입력해 주세요.");
    return;
  }
  const btn = document.getElementById("nickname-save-btn");
  if (btn) btn.disabled = true;
  try {
    await setDoc(
      doc(db, COL_PROFILES, u.uid),
      {
        nickname: nick,
        updatedAt: serverTimestamp(),
      },
      { merge: true }
    );
    closeAllModals();
  } catch (e) {
    console.error(e);
    alert("저장에 실패했습니다. Firestore 규칙에서 프로필 쓰기가 허용되는지 확인해 주세요.");
  }
  if (btn) btn.disabled = false;
}

onAuthStateChanged(auth, (user) => {
  updateAuthUI(user);

  if (!user) {
    unsubscribeProfile();
    unsubscribeFirestore();
    state.books = [];
    state.reviews = [];
    state.schedules = [];
    setMainInteractionEnabled(false);
    setSyncStatus("구글 로그인 후 데이터를 불러옵니다.");
    render();
    refreshReviewAuthorDisplay();
    return;
  }

  subscribeProfile(user.uid);
  setMainInteractionEnabled(true);
  subscribeFirestore();
  refreshReviewAuthorDisplay();
});

// ===== HELPERS =====
function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function starsHTML(rating, size='11px') {
  let h = '<div class="stars">';
  for(let i=1;i<=5;i++) h += `<div class="star ${i<=rating?'on':'off'}" style="width:${size};height:${size};border-radius:50%;"></div>`;
  return h + '</div>';
}

function reviewStarsHTML(rating) {
  let h = '<div class="review-stars">';
  for(let i=1;i<=5;i++) h += `<div class="review-star ${i<=rating?'on':'off'}"></div>`;
  return h + '</div>';
}

function avgRating(bookTitle) {
  const rs = state.reviews.filter(r => r.bookTitle === bookTitle);
  if(!rs.length) return 0;
  return Math.round(rs.reduce((a,r)=>a+r.rating,0)/rs.length);
}

function reviewCount(bookTitle) {
  return state.reviews.filter(r => r.bookTitle === bookTitle).length;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function formatMonth(monthStr) {
  if(!monthStr) return '';
  const [y,m] = monthStr.split('-');
  return `${y}년 ${parseInt(m)}월`;
}

function calcDday(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const diff = Math.round((target - today)/(1000*60*60*24));
  if(diff === 0) return 'D-Day';
  if(diff > 0) return `D-${diff}`;
  return `D+${Math.abs(diff)}`;
}

function formatTime(timeStr) {
  if(!timeStr) return '';
  const [h,m] = timeStr.split(':');
  const hour = parseInt(h);
  const ampm = hour < 12 ? '오전' : '오후';
  const h12 = hour === 0 ? 12 : hour > 12 ? hour-12 : hour;
  return `${ampm} ${h12}시${m!=='00'?' '+m+'분':''}`;
}

// ===== RENDER =====
function render() {
  renderHome();
  renderBooks();
  renderReviews();
  renderSchedule();
}

function renderHome() {
  // Next meeting
  const now = new Date(); now.setHours(0,0,0,0);
  const upcoming = state.schedules
    .filter(s => new Date(s.date) >= now)
    .sort((a,b) => new Date(a.date)-new Date(b.date));
  const el = document.getElementById('next-meeting-area');
  if(upcoming.length) {
    const s = upcoming[0];
    el.innerHTML = `
      <div class="next-meeting">
        <div class="meeting-tag">다음 모임</div>
        <div class="meeting-book">${escapeHtml(s.book)}</div>
        <div class="meeting-detail">📅 ${formatDate(s.date)} ${formatTime(s.time)}</div>
        ${s.place ? `<div class="meeting-detail">📍 ${escapeHtml(s.place)}</div>` : ''}
        <div class="dday">${calcDday(s.date)}</div>
      </div>`;
  } else {
    el.innerHTML = `<div class="no-meeting">아직 예정된 모임이 없어요<br><span style="font-size:12px;">일정 탭에서 추가해보세요</span></div>`;
  }

  // Recent books
  const bel = document.getElementById('home-books-area');
  const recent = state.books.slice(0, 3);
  if(recent.length) {
    bel.innerHTML = recent.map(b => bookCardHTML(b, true)).join('');
  } else {
    bel.innerHTML = `<div class="empty">아직 읽은 책이 없어요</div>`;
  }
}

function bookCardHTML(b, editable) {
  const rating = avgRating(b.title);
  const count = reviewCount(b.title);
  const t = escapeHtml(b.title);
  const a = escapeHtml(b.author);
  const bid = JSON.stringify(b.id);
  const actions = editable ? `
    <div class="card-actions">
      <button type="button" class="card-action-btn" onclick='openBookEdit(${bid})'>수정</button>
      <button type="button" class="card-action-btn danger" onclick='deleteBook(${bid})'>삭제</button>
    </div>` : '';
  return `<div class="book-card">
    <div class="book-cover" style="background:${escapeHtml(b.color)}">${b.emoji}</div>
    <div class="book-info">
      <div class="book-title">${t}</div>
      <div class="book-author">${a}${b.date ? ' · '+formatMonth(b.date) : ''}</div>
      <div style="display:flex;align-items:center;gap:4px;">
        ${starsHTML(rating)}
        <span class="review-count">한줄평 ${count}개</span>
      </div>
    </div>
    ${actions}
  </div>`;
}

function renderBooks() {
  const el = document.getElementById('books-area');
  if(!state.books.length) {
    el.innerHTML = `<div class="empty">📚<br>아직 읽은 책이 없어요<br>+ 버튼으로 추가해보세요</div>`;
    return;
  }
  el.innerHTML = state.books.map(b => bookCardHTML(b, true)).join('');
}

function renderReviews() {
  const el = document.getElementById('reviews-area');
  if(!state.reviews.length) {
    el.innerHTML = `<div class="empty">✍️<br>아직 한줄평이 없어요<br>첫 번째 한줄평을 남겨보세요</div>`;
    return;
  }
  el.innerHTML = state.reviews.map(r => {
    const rid = JSON.stringify(r.id);
    return `
    <div class="review-card">
      <div class="review-header">
        <span class="review-book-title">『${escapeHtml(r.bookTitle)}』</span>
        ${reviewStarsHTML(r.rating)}
      </div>
      <div class="review-author">${escapeHtml(r.author)}</div>
      <div class="review-text">"${escapeHtml(r.text)}"</div>
      <div class="review-footer-row">
        <div class="card-actions" style="margin-top:0;">
          <button type="button" class="card-action-btn" onclick='openReviewEdit(${rid})'>수정</button>
          <button type="button" class="card-action-btn danger" onclick='deleteReview(${rid})'>삭제</button>
        </div>
        <div class="review-date">${escapeHtml(r.date)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderSchedule() {
  const el = document.getElementById('schedule-area');
  if(!state.schedules.length) {
    el.innerHTML = `<div class="empty">📅<br>등록된 일정이 없어요</div>`;
    return;
  }
  const now = new Date(); now.setHours(0,0,0,0);
  el.innerHTML = state.schedules.map(s => {
    const isUpcoming = new Date(s.date) >= now;
    const placePart = s.place ? ' · '+escapeHtml(s.place) : '';
    const sid = JSON.stringify(s.id);
    return `<div class="schedule-card ${isUpcoming?'upcoming':'past'}">
      <div class="schedule-tag ${isUpcoming?'':'past'}">${isUpcoming?'예정된 모임':'지난 모임'}</div>
      <div class="schedule-book">${escapeHtml(s.book)}</div>
      <div class="schedule-meta">${formatDate(s.date)} ${formatTime(s.time)}${placePart}</div>
      ${isUpcoming ? `<div style="margin-top:8px;"><span style="background:var(--purple);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;">${calcDday(s.date)}</span></div>` : ''}
      <div class="schedule-card-actions">
        <button type="button" class="card-action-btn" onclick='openScheduleEdit(${sid})'>수정</button>
        <button type="button" class="card-action-btn danger" onclick='deleteSchedule(${sid})'>삭제</button>
      </div>
    </div>`;
  }).join('');
}

  openModal("modal-select");

function openModal(id) {

function resetBookForm() {

  document.getElementById('book-title').value = '';
  document.getElementById('book-author').value = '';
  document.getElementById('book-date').value = '';
  state.selectedEmoji = '📖';
  state.selectedColor = '#EEEDFE';

function openNewBookModal() {
  resetBookForm();
  closeAllModals();
  document.getElementById('modal-book').classList.add('open');
}

function openBookEdit(id) {
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  editingBookId = id;
  document.getElementById('book-title').value = b.title;
  document.getElementById('book-author').value = b.author;
  document.getElementById('book-date').value = b.date || '';
  state.selectedEmoji = b.emoji;
  state.selectedColor = b.color;
  document.querySelectorAll('.emoji-opt').forEach(e => {
    e.classList.toggle('selected', e.dataset.emoji === b.emoji);
  });
  document.querySelectorAll('.color-opt').forEach(e => {
    e.classList.toggle('selected', e.dataset.color === b.color);
  });
  document.getElementById('modal-book-title-text').textContent = '책 수정';
  document.getElementById('book-submit-btn').textContent = '저장하기';
  closeAllModals();
  document.getElementById('modal-book').classList.add('open');
}

async function deleteBook(id) {
  if (!confirm('이 책을 삭제하면 이 책에 달린 한줄평도 함께 삭제됩니다. 계속할까요?')) return;
  try {
    const batch = writeBatch(db);
    batch.delete(doc(db, COL_BOOKS, id));
    const qRev = query(collection(db, COL_REVIEWS), where("bookId", "==", id));
    const revSnap = await getDocs(qRev);
    revSnap.forEach((d) => batch.delete(d.ref));
    await batch.commit();
  } catch (e) {
    console.error(e);
    alert("삭제에 실패했습니다. 네트워크와 Firestore 규칙을 확인해 주세요.");
  }
}

function resetReviewForm() {
  editingReviewId = null;
  document.getElementById('review-book').value = '';
  document.getElementById('review-text').value = '';
  state.selectedStar = 0;
  document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('modal-review-title-text').textContent = '한줄평 쓰기';
  document.getElementById('review-submit-btn').textContent = '등록하기';
  refreshReviewAuthorDisplay();
}

function openNewReviewModal() {

  closeAllModals();
  populateBookSelect();
  document.getElementById('modal-review').classList.add('open');
}

function openReviewEdit(id) {

  editingReviewId = id;
  populateBookSelect();
  document.getElementById('review-book').value = String(r.bookId);
  document.getElementById('review-text').value = r.text;

  document.getElementById('review-submit-btn').textContent = '저장하기';

  document.getElementById('modal-review').classList.add('open');

}

async function deleteReview(id) {
  if (!confirm('이 한줄평을 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, COL_REVIEWS, id));

function resetScheduleForm() {

  document.getElementById('sched-book').value = '';
  document.getElementById('sched-date').value = '';
  document.getElementById('sched-time').value = '19:00';
  document.getElementById('sched-place').value = '';

function openNewScheduleModal() {

  closeAllModals();
  document.getElementById('modal-schedule').classList.add('open');
}

function openScheduleEdit(id) {
  const s = state.schedules.find(x => x.id === id);
  if (!s) return;
  editingScheduleId = id;
  document.getElementById('sched-book').value = s.book;
  document.getElementById('sched-date').value = s.date;

async function deleteSchedule(id) {
  if (!confirm('이 일정을 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, COL_SCHEDULES, id));
  } catch (e) {
    console.error(e);
    alert("삭제에 실패했습니다.");

function closeAllModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
}

// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if(e.target === overlay) closeAllModals(); });
});

function populateBookSelect() {
  const sel = document.getElementById('review-book');
  sel.innerHTML = '<option value="">책을 선택하세요</option>';
  state.books.forEach(b => {
    sel.innerHTML += `<option value="${String(b.id)}">${escapeHtml(b.title)}</option>`;
  });
}

// ===== EMOJI / COLOR / STAR =====
function selectEmoji(el) {
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  state.selectedEmoji = el.dataset.emoji;
}

function selectColor(el) {
  document.querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  state.selectedColor = el.dataset.color;
}

function selectStar(val) {
  state.selectedStar = val;
  document.querySelectorAll('.star-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.val) <= val);
  });
}

// ===== SAVE (Firestore) =====
async function saveBook() {
  if (!auth.currentUser) {
    alert("로그인이 필요합니다.");
    return;
  }
  const title = document.getElementById('book-title').value.trim();
  const author = document.getElementById('book-author').value.trim();
  if(!title || !author) { alert('책 제목과 저자를 입력해주세요'); return; }
  const date = document.getElementById('book-date').value;
  try {
    if (editingBookId != null) {
      const ref = doc(db, COL_BOOKS, editingBookId);
      const b = state.books.find(x => x.id === editingBookId);
      const oldTitle = b ? b.title : null;
      await updateDoc(ref, {
        title, author, date,
        emoji: state.selectedEmoji,
        color: state.selectedColor,
      });
      if (oldTitle && oldTitle !== title) {
        const qRev = query(collection(db, COL_REVIEWS), where('bookId', '==', editingBookId));
        const rs = await getDocs(qRev);
        const batch = writeBatch(db);
        rs.forEach(d => batch.update(d.ref, { bookTitle: title }));
        await batch.commit();
      }
    } else {
      await addDoc(collection(db, COL_BOOKS), {
        title, author, date,
        emoji: state.selectedEmoji,
        color: state.selectedColor,
        createdAt: serverTimestamp(),
      });
    }
  } catch (e) {
    console.error(e);
    alert('저장에 실패했습니다. Firestore 규칙과 네트워크를 확인해 주세요.');
    return;
  }
  resetBookForm();
  closeAllModals();
}

async function saveReview() {
  if (!auth.currentUser) {
    alert("로그인이 필요합니다.");
    return;
  }
  const author = getWriterDisplayName();
  const bookId = document.getElementById('review-book').value;
  const text = document.getElementById('review-text').value.trim();
  if (!author) {
    alert("표시할 이름을 확인할 수 없습니다. 닉네임을 설정하거나 Google 계정 이름을 확인해 주세요.");
    return;
  }
  if (!bookId || !text) {
    alert('책과 한줄평을 입력해주세요');
    return;
  }
  const book = state.books.find(b => String(b.id) === String(bookId));
  if (!book) { alert('선택한 책을 찾을 수 없습니다'); return; }
  const rating = state.selectedStar > 0 ? state.selectedStar : 3;
  try {
    if (editingReviewId != null) {
      await updateDoc(doc(db, COL_REVIEWS, editingReviewId), {
        bookId,
        bookTitle: book.title,
        author,
        rating,
        text,
      });
    } else {
      const today = new Date().toISOString().slice(0,10);
      await addDoc(collection(db, COL_REVIEWS), {
        bookId,
        bookTitle: book.title,
        author,
        rating,
        text,
        date: today,
        createdAt: serverTimestamp(),
      });
    }
  } catch (e) {
    console.error(e);
    alert('저장에 실패했습니다.');
    return;
  }
  resetReviewForm();
  closeAllModals();
  showPage('reviews');
}

async function saveSchedule() {
  if (!auth.currentUser) {
    alert("로그인이 필요합니다.");
    return;
  }
  const book = document.getElementById('sched-book').value.trim();
  const date = document.getElementById('sched-date').value;
  if(!book || !date) { alert('책 제목과 날짜를 입력해주세요'); return; }
  const time = document.getElementById('sched-time').value;
  const place = document.getElementById('sched-place').value.trim();
  try {
    if (editingScheduleId != null) {
      await updateDoc(doc(db, COL_SCHEDULES, editingScheduleId), {
        book, date, time, place,
      });
    } else {
      await addDoc(collection(db, COL_SCHEDULES), {
        book, date, time, place,
        createdAt: serverTimestamp(),
      });
    }
  } catch (e) {
    console.error(e);
    alert('저장에 실패했습니다.');
    return;
  }
  resetScheduleForm();
  closeAllModals();
  showPage('schedule');
}
